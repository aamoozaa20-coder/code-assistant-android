name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      - name: Generate Android platform files
        run: |
          flutter create . --project-name code_assistant --org com.codeassistant.app --platforms android
          # Restore our custom files that might get overwritten
          git checkout -- lib/ pubspec.yaml analysis_options.yaml || true

      - name: Get dependencies
        run: flutter pub get

      - name: Build Release APK
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: code-assistant-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
