name: code_assistant
description: اپ کدنویس فارسی با پشتیبانی چند مدل و API سفارشی
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  http: ^1.2.0
  shared_preferences: ^2.2.2
  path_provider: ^2.1.2
  file_picker: ^6.1.1
  flutter_markdown: ^0.6.18
  google_fonts: ^6.1.0
  provider: ^6.1.1
  uuid: ^4.3.3
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
  assets:
    - assets/
